{{- if .Values.keycloak.enabled }}
---
# Servico ClusterIP para acesso ao Keycloak pelo APISIX (plugin openid-connect)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apisix-poc.keycloak.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apisix-poc.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: {{ .Values.keycloak.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: keycloak
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.keycloak.service.port }}
      targetPort: http
---
# Servico Headless para descoberta de peers Keycloak via JGroups (clustering Infinispan)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apisix-poc.keycloak.fullname" . }}-discovery
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apisix-poc.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: keycloak
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port }}
      targetPort: http
{{- end }}
